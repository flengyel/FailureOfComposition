alignment:
  namespace: "FailureOfComposition.Palomar"
  statements:
    - source: "v36 Theorem 1, four witness properties"
      lean: "FailureOfComposition.Palomar.obstruction_four_properties"
      module: "FailureOfComposition.Palomar.Solution"
      status: "proved"
      note: "Uses the maintained productive witness theorem; both middle clauses retain uniform provability."
    - source: "v36 Theorem 1 and Corollary 2, productive route"
      lean: "FailureOfComposition.Palomar.no_quotient_composition_productive"
      module: "FailureOfComposition.Palomar.Solution"
      status: "proved"
      note: "No quotient operation can satisfy the representative composition equation."
    - source: "v36 Theorem 1 and Corollary 2, Gödel-II route"
      lean: "FailureOfComposition.Palomar.no_quotient_composition_godel"
      module: "FailureOfComposition.Palomar.Solution"
      status: "proved"
      note: "Same statement via the separately audited Gödel-II proof and r.e. presentation bridge."
    - source: "v36 Theorem 3"
      lean: "FailureOfComposition.Palomar.pi_one_characterization"
      module: "FailureOfComposition.Palomar.Solution"
      status: "proved"
      note: "Consistency and PA extension; no enumerability hypothesis."
    - source: "v36 Theorem 4"
      lean: "FailureOfComposition.Palomar.generated_congruence_classification"
      module: "FailureOfComposition.Palomar.Solution"
      status: "proved"
      note: "Every PA extension, including inconsistent theories."
    - source: "v36 Proposition 5"
      lean: "FailureOfComposition.Palomar.weak_totality_counterexample"
      module: "FailureOfComposition.Palomar.Solution"
      status: "proved"
      note: "Concrete productive guard and concrete identity have different weak-totality values."
    - source: "v36 Proposition 6, Gödel-II route"
      lean: "FailureOfComposition.Palomar.range_counterexample_godel"
      module: "FailureOfComposition.Palomar.Solution"
      status: "proved"
      note: "Range is specified by a PA-uniform graph equation, not only standard extensional equality."
    - source: "v36 Proposition 6, additional productive route"
      lean: "FailureOfComposition.Palomar.range_counterexample_productive"
      module: "FailureOfComposition.Palomar.Solution"
      status: "proved"
      note: "Same range counterexample statement with a separate productive proof root."
    - source: "v36 section 5, quotient-monoid consequence of Theorem 4"
      lean: "FailureOfComposition.Palomar.generated_quotient_partial_recursive"
      module: "FailureOfComposition.Palomar.Solution"
      status: "proved"
      note: "Actual unary partial recursive functions, with the representative equation fixing evaluation."

