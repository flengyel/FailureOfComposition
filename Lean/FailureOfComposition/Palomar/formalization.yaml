fidelity:
  divergences: >-
    The formalization uses the constructed PA arithmetization of Mathlib's
    natural-number program indices and its actual partial evaluation. Least
    successful history-evaluator stages implement the manuscript's
    least-computation construction; literal identity with historical numerical
    coding is not claimed. Arbitrary recursively enumerable axiom sets use a
    deductively equivalent Craig Delta-one presentation on the Gödel route,
    rather than identifying its proof codes with the manuscript's augmented
    derivation codes. Weak-totality witnesses use the productive history guard.
    Quantification over inputs in pointwise provability is external and standard;
    uniform graph equations quantify internally in PA. The categorical
    consequence concerns the failed induced operation on endomorphisms of omega,
    not a separately formalized reconstruction of every historical multiobject
    category. Range indices are chosen from PA-correct graph realizations;
    classical choice of an index is not claimed to be a computable selector.
    Proof-dependency separation between the productive and Gödel routes is not
    a claim of logical independence of two unspecified formal sentences.
    Novelty beyond the cited manuscript has not been established here.

