status:
  scope: >-
    The maintained FailureOfComposition development proves the six numbered
    manuscript results as concrete program-index statements, with the
    documented arithmetization conventions. The draft Comparator configuration
    selects nine theorem declarations: four-witness obstruction; productive
    and Gödel-II quotient-composition obstructions; Pi-one characterization;
    generated-congruence classification; weak-totality counterexample;
    Gödel-II and productive range counterexamples; and the sound generated
    quotient's evaluation-preserving monoid isomorphism. Auxiliary results in
    the maintained library are described in MANUSCRIPT_COVERAGE.md but are not
    all independently selected in this configuration. Deliberate holes occur
    only in the draft Challenge and are excluded from the following proof
    counts. Historical Audit probes and test fixtures in the original
    development repository are outside this statement count. No Palomar eligibility or acceptance is claimed.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]

