      lean: "FailureOfComposition.Palomar.obstruction_four_properties"
      module: "FailureOfComposition.Palomar.SolutionNine"
      status: "proved"
      note: "Uses the maintained productive witness theorem; both middle clauses retain uniform provability."
    - source: "v37 Theorem 1 and Corollary 2, productive route"
      lean: "FailureOfComposition.Palomar.no_quotient_composition_productive"
      module: "FailureOfComposition.Palomar.SolutionNine"
      status: "proved"
      note: "No quotient operation can satisfy the representative composition equation."
    - source: "v37 Theorem 1 and Corollary 2, Gödel-II route"
      lean: "FailureOfComposition.Palomar.no_quotient_composition_godel"
      module: "FailureOfComposition.Palomar.SolutionNine"
      status: "proved"
      note: "Same statement via the separately audited Gödel-II proof and r.e. presentation bridge."
    - source: "v37 Theorem 3"
      lean: "FailureOfComposition.Palomar.pi_one_characterization"
      module: "FailureOfComposition.Palomar.SolutionNine"
      status: "proved"
      note: "Consistency and PA extension; no enumerability hypothesis."
    - source: "v37 Theorem 4"
      lean: "FailureOfComposition.Palomar.generated_congruence_classification"
      module: "FailureOfComposition.Palomar.SolutionNine"
      status: "proved"
      note: "Every PA extension, including inconsistent theories."
    - source: "v37 Proposition 5"
