version: "v0.4"

project:
  name: "Pointwise provable equality and the failure of composition"
  description: >-
    A Lean formalization of program-index results about pointwise provable
    equality over extensions of Peano arithmetic. For every consistent
    recursively enumerable extension, program composition fails to descend to
    the pointwise quotient, with separate productive-set and Gödel-II proofs;
    weak totality and the range assignment also depend on representatives.
    For every consistent PA extension, composition compatibility is equivalent
    to completeness for true Pi-one sentences and to agreement with extensional
    equality. For every PA extension, the least generated composition congruence
    is extensional equality when the theory is Sigma-one sound and universal
    otherwise. In the sound case its quotient is isomorphic to the monoid of
    actual unary partial recursive functions. This package is a draft Palomar
    statement interface. The Lean 4.35.0-rc2 port and evaluator cleanup have
    passed project verification; Challenge-import eligibility remains unresolved,
    the manuscript retains its existing licensing, and Comparator has not run.
  authors:
    - "Florian Lengyel"
  responsible_maintainers:
    - "Florian Lengyel"
  # Existing Lean/support-code license is present at LICENSE and Lean/LICENSE.
  # The manuscript retains its existing licensing; no new paper license is granted.
  license: "Apache-2.0"

